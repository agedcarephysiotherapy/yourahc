name: Import YHC Web images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Unsplash images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/yhc-web
          declare -A urls
          urls["yhc-01-wheelchair-family.jpg"]="https://plus.unsplash.com/premium_photo-1681995989551-3645d9ce35ad?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-02-child-physiotherapy.jpg"]="https://images.unsplash.com/photo-1708686816818-2b018e0c1296?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-03-wheelchair-support.jpg"]="https://plus.unsplash.com/premium_photo-1681490369503-3d40d376bd9d?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-04-prosthetic-leg.jpg"]="https://images.unsplash.com/photo-1569937714595-394e6c470c28?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-05-wheelchair-room.jpg"]="https://images.unsplash.com/photo-1709880631993-0ec9e9093fa7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-06-down-syndrome-plant-care.jpg"]="https://plus.unsplash.com/premium_photo-1663100674844-d1ae72e68c58?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-07-child-physio-room.jpg"]="https://images.unsplash.com/photo-1708686816813-b81e6c8cc7e0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-08-wheelchair-kitchen-care.jpg"]="https://plus.unsplash.com/premium_photo-1681484181360-97612e34794f?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-09-healthcare-professional.jpg"]="https://images.unsplash.com/photo-1695654401197-ab988f0e3fba?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-10-professional-portrait-blue.jpg"]="https://images.unsplash.com/photo-1569937728357-4971c45997c0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-11-wheelchair-kitchen.jpg"]="https://images.unsplash.com/photo-1633466159898-6f5b1a7b5a79?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-12-wheelchair-basketball.jpg"]="https://plus.unsplash.com/premium_photo-1716758706865-6e282e7bb18d?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-13-disability-community.jpg"]="https://images.unsplash.com/photo-1620065865072-6eb90f4df05e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-14-team-maroon.jpg"]="https://images.unsplash.com/photo-1569937703691-0f9b8cf21a25?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-15-clinician-seated.jpg"]="https://images.unsplash.com/photo-1581090122319-8fab9528eaaa?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-16-wheelchair-outdoors.jpg"]="https://images.unsplash.com/photo-1570793005299-c091be91bbad?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"
          urls["yhc-17-wheelchair-family-park.jpg"]="https://plus.unsplash.com/premium_photo-1661661677668-eff432a2080f?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=80&w=1080"

          for file in "${!urls[@]}"; do
            echo "Downloading $file"
            curl -fL --retry 3 --retry-delay 2 "${urls[$file]}" -o "images/yhc-web/$file"
          done

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/yhc-web
          git commit -m "Add YHC Web Unsplash image collection" || exit 0
          git push

      - name: Remove import workflow
        if: success()
        run: |
          git rm .github/workflows/import-yhc-images.yml
          git commit -m "Remove one-time YHC image import workflow"
          git push
