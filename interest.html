<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b63"><title>YOUR | Register Your Interest</title><link rel="icon" href="/images/circle%20YAHC%20logo.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>
.interest-page{min-height:100vh;background:linear-gradient(145deg,#f7f5ef,#e8f3ee);padding-bottom:70px}.interest-main{width:min(820px,92vw);margin:auto;padding:55px 0}.interest-card{background:#fffdf8;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(28px,5vw,58px)}.interest-head{text-align:center;margin-bottom:36px}.interest-head h1{font:800 clamp(38px,6vw,64px)/1.05 Manrope;margin:0 0 14px;letter-spacing:-2px}.interest-head p{font-size:18px;color:var(--muted);margin:auto;max-width:600px}.interest-form{display:grid;gap:24px}.interest-field span,.service-title{display:block;font:700 17px Manrope;margin-bottom:9px}.interest-field small{font:500 13px 'DM Sans';color:var(--muted);margin-left:5px}.interest-field input,.interest-field textarea{width:100%;min-height:68px;border:2px solid var(--line);border-radius:15px;background:#fff;padding:15px 18px;font-size:20px;color:var(--ink);outline:0;font-family:inherit;resize:vertical}.interest-field textarea{min-height:130px}.interest-field input:focus,.interest-field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(23,107,99,.1)}.interest-field input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(23,107,99,.1)}.service-box{padding:22px;border:2px solid var(--line);border-radius:18px}.service-options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.service-option input{position:absolute;opacity:0}.service-option label{min-height:72px;border:2px solid var(--line);border-radius:14px;display:flex;align-items:center;padding:16px 18px;font-size:19px;font-weight:700;cursor:pointer;background:#fff}.service-option input:checked+label{border-color:var(--teal);background:var(--mint);box-shadow:inset 0 0 0 1px var(--teal)}.service-option label:before{content:"";width:24px;height:24px;border:2px solid #9aaba7;border-radius:7px;margin-right:13px;background:#fff}.service-option input:checked+label:before{content:"✓";display:grid;place-items:center;background:var(--teal);border-color:var(--teal);color:#fff;font-size:16px}.interest-submit{width:100%;min-height:70px;justify-content:center;font-size:20px}.interest-status{text-align:center;min-height:28px;font-weight:700}.interest-status.success{color:var(--teal)}.interest-status.error{color:#b43f24}.issued-codes{display:none;text-align:center;background:var(--mint);border-radius:20px;padding:25px}.issued-codes.show{display:block}.issued-codes strong{font:800 34px Manrope;letter-spacing:2px;display:block}.issued-codes p{margin:6px 0 0;color:var(--muted)}@media(max-width:600px){.interest-main{padding:28px 0}.interest-card{border-radius:20px;padding:24px 18px}.interest-head h1{letter-spacing:-1px}.interest-head p{font-size:16px}.service-options{grid-template-columns:1fr}.interest-field input{min-height:64px;font-size:19px}}
</style></head><body class="interest-page"><header class="site-header"><a class="brand" href="/" aria-label="YOUR Allied Health Care home"><img class="brand-logo" src="/images/circle%20YAHC%20logo.png" alt="YOUR Allied Health Care logo"><span><strong>YOUR</strong><small>Allied Health Care</small></span></a><a class="button button-small" href="/">Home</a></header><main class="interest-main"><section class="interest-card"><div class="interest-head"><div class="section-label">YOUR AHC</div><h1>Register your interest</h1><p>Tell us a little about yourself and the allied health service you may be interested in.</p></div><form id="interestForm" class="interest-form"><label class="interest-field"><span>Name <b>*</b></span><input name="name" autocomplete="name" required></label><label class="interest-field"><span>Contact Number <b>*</b></span><input name="contactNumber" type="tel" inputmode="tel" autocomplete="tel" required></label><label class="interest-field"><span>Email <small>optional</small></span><input name="email" type="email" inputmode="email" autocomplete="email"></label><label class="interest-field"><span>Suburb / Postcode <b>*</b></span><input name="suburbPostcode" autocomplete="postal-code" required></label><label class="interest-field"><span>Message <small>optional</small></span><textarea name="message" rows="5" placeholder="Tell us anything you would like us to know"></textarea></label><div class="service-box"><div class="service-title">Services you may be interested in <b>*</b></div><div class="service-options"><div class="service-option"><input id="physio" type="checkbox" name="services" value="Physiotherapy"><label for="physio">Physiotherapy</label></div><div class="service-option"><input id="ot" type="checkbox" name="services" value="Occupational Therapy"><label for="ot">Occupational Therapy</label></div></div></div><button class="button interest-submit" type="submit">Submit →</button><div id="interestStatus" class="interest-status" role="status"></div><div id="issuedCodes" class="issued-codes"><div>Your enquiry has been registered.</div><strong id="codeDisplay"></strong><p>Please keep these codes for your records.</p></div></form></section></main><script>
document.getElementById('interestForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.getElementById('interestStatus'),b=f.querySelector('button'),checks=[...f.querySelectorAll('input[name="services"]:checked')];s.className='interest-status';s.textContent='';if(!f.checkValidity()||!checks.length){f.reportValidity();if(!checks.length)s.textContent='Please select Physiotherapy, Occupational Therapy, or both.';s.classList.add('error');return}b.disabled=true;b.textContent='Submitting…';try{const r=await fetch('https://yrevkjrichztuceguhaq.supabase.co/functions/v1/yahc-interest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.value,contactNumber:f.contactNumber.value,email:f.email.value,suburbPostcode:f.suburbPostcode.value,message:f.message.value,services:checks.map(x=>x.value)})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'Unable to submit.');s.className='interest-status success';s.textContent='Thank you. Your details have been received.';document.getElementById('codeDisplay').textContent=j.codeOne+'  •  '+j.codeTwo;document.getElementById('issuedCodes').classList.add('show');f.querySelectorAll('input').forEach(x=>x.disabled=true);b.disabled=true;b.textContent='Submitted'}catch(err){s.className='interest-status error';s.textContent=err.message||'Please try again.';b.disabled=false;b.textContent='Submit →'}});</script></body></html>
